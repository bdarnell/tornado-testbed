# Dependabot owns the downstream version pins.
#
# Each packages/<name>/requirements.txt holds exactly one `name==version`, so a
# bump is one small, reviewable pull request. The git tag the harness checks out
# is derived from that version via tag_template in package.env, which is why the
# version is the only thing that needs managing here.
#
# .github/workflows/pins.yml runs the affected package on each of these pull
# requests, so a bump that needs its deselects re-curated says so on its own PR
# rather than during a release build.
version: 2
updates:
  # One entry per packages/<name>/ directory. Separate directories (rather than
  # one shared requirements file) are deliberate: dependabot would otherwise
  # have to resolve streamlit, distributed and jupyterhub into a single
  # environment, which cannot succeed.
  #
  # The directories are listed explicitly, not as a "/packages/*" glob: with the
  # glob, every bump arrived twice, once "in /packages" and once "in
  # /packages/<name>", with identical diffs. That is a known, unfixed dependabot
  # bug with glob directories (dependabot/dependabot-core#10884), not something
  # a better pattern avoids. scripts/validate_packages.py checks that this list
  # matches packages/ exactly, so a new package cannot be left out.
  - package-ecosystem: "pip"
    directories:
      - "/packages/bokeh"
      - "/packages/distributed"
      - "/packages/flower"
      - "/packages/ipykernel"
      - "/packages/jupyter_server"
      - "/packages/jupyterhub"
      - "/packages/mitmproxy"
      - "/packages/notebook"
      - "/packages/panel"
      - "/packages/thumbor"
      - "/packages/voila"
    schedule:
      interval: "weekly"
    # One PR per package, so the default of 5 would starve some of them.
    open-pull-requests-limit: 12
    # No `ignore` rules on purpose. A pin frozen here is a pin nobody revisits,
    # and the two candidates for one did not survive scrutiny: streamlit was
    # removed outright once it moved off Tornado, and jupyter_server tracks
    # upstream even though that cost the tornado#3724 detector (see that
    # package's README). Add one only with a reason that will still read as
    # sound a year from now.
    commit-message:
      prefix: "pins"
    labels:
      - "dependencies"
      - "downstream-pin"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "actions"
    labels:
      - "dependencies"
