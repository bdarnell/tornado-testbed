# Run the downstream test suites against a chosen Tornado build.
#
# Three ways in:
#   workflow_dispatch  run it by hand from the Actions tab
#   workflow_call      call it from another repository -- this is how tornado's
#                      own release build gates on the testbed
#   schedule           weekly, against tornado master, to keep the curated
#                      green baseline honest between releases
#
# All the real logic lives in scripts/ -- keep this file thin.
name: testbed

on:
  workflow_dispatch:
    inputs:
      tornado_spec:
        description: "What to install tornado from (any `uv pip install` spec: a git+URL to a branch/fork, a version pin, a wheel, ...)"
        type: string
        required: false
        default: "git+https://github.com/tornadoweb/tornado.git@master"
      packages:
        description: "Space-separated package names to run (default: all)"
        type: string
        required: false
        default: ""
      python_version:
        description: "Python for the per-package venvs"
        type: string
        required: false
        default: "3.13"
      coverage:
        description: "Measure Tornado coverage and upload the raw data"
        type: boolean
        required: false
        default: false
      fail_on_regression:
        description: "Fail the run unless every package passes"
        type: boolean
        required: false
        default: true

  workflow_call:
    inputs:
      tornado_spec:
        description: "What to install tornado from. Ignored when tornado_artifact is set."
        type: string
        required: false
        default: "git+https://github.com/tornadoweb/tornado.git@master"
      tornado_artifact:
        description: >-
          Name of an artifact in the CALLING workflow run holding a tornado
          wheel and/or sdist. A called workflow shares the caller's run, so this
          tests the exact artifact that run built rather than a re-resolved git
          ref. Takes precedence over tornado_spec, and the version it names is
          asserted against the version that ends up installed.
        type: string
        required: false
        default: ""
      packages:
        type: string
        required: false
        default: ""
      python_version:
        type: string
        required: false
        default: "3.13"
      coverage:
        type: boolean
        required: false
        default: false
      fail_on_regression:
        type: boolean
        required: false
        default: true
      timeout_secs:
        description: "Per-package wall-clock limit passed to timeout(1)"
        type: string
        required: false
        default: "900"
    outputs:
      total:
        description: "Number of packages run"
        value: ${{ jobs.report.outputs.total }}
      passed:
        description: "Number that passed"
        value: ${{ jobs.report.outputs.passed }}
      failed:
        description: "Number that did not pass"
        value: ${{ jobs.report.outputs.failed }}

  schedule:
    # Weekly. Without this, a release run is where we would discover that
    # downstream drift has broken the baseline -- which is how gates get
    # ignored.
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  # Resolve the run's settings once (the three triggers supply them
  # differently, and `schedule` supplies none) and expand the package list.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tornado_spec: ${{ steps.cfg.outputs.tornado_spec }}
      tornado_artifact: ${{ steps.cfg.outputs.tornado_artifact }}
      python_version: ${{ steps.cfg.outputs.python_version }}
      coverage: ${{ steps.cfg.outputs.coverage }}
      fail_on_regression: ${{ steps.cfg.outputs.fail_on_regression }}
      timeout_secs: ${{ steps.cfg.outputs.timeout_secs }}
    steps:
      # Not a bare checkout: github.repository is the CALLER's repository, so
      # under `workflow_call` this checked out tornado -- which has no scripts/
      # -- and every step below died on a missing file. The job context names
      # the repository and commit of the workflow file defining this job, which
      # is this file, so the harness that runs is the one belonging to the
      # workflow the caller pinned. For a dispatch, the schedule, or pins.yml's
      # local call it is this repository at the run's own commit, as before.
      - name: Check out the testbed
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Validate package definitions
        run: python3 scripts/validate_packages.py

      - name: Resolve settings
        id: cfg
        env:
          IN_TORNADO_SPEC: ${{ inputs.tornado_spec }}
          IN_TORNADO_ARTIFACT: ${{ inputs.tornado_artifact }}
          IN_PYTHON_VERSION: ${{ inputs.python_version }}
          IN_COVERAGE: ${{ inputs.coverage }}
          IN_FAIL_ON_REGRESSION: ${{ inputs.fail_on_regression }}
          IN_TIMEOUT_SECS: ${{ inputs.timeout_secs }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # `schedule` runs have no inputs at all, so every value needs a
          # fallback here rather than only in the `on:` block.
          #
          # The weekly run is the one that measures coverage: it is not gating
          # anything, so it can afford pytest-cov, and it is what keeps the
          # per-package floors honest between releases.
          coverage=0
          if [[ "${IN_COVERAGE}" == "true" || "${EVENT_NAME}" == "schedule" ]]; then
            coverage=1
          fi
          {
            echo "tornado_spec=${IN_TORNADO_SPEC:-git+https://github.com/tornadoweb/tornado.git@master}"
            echo "tornado_artifact=${IN_TORNADO_ARTIFACT:-}"
            echo "python_version=${IN_PYTHON_VERSION:-3.13}"
            echo "coverage=${coverage}"
            echo "fail_on_regression=$([[ "${IN_FAIL_ON_REGRESSION}" == "false" ]] && echo 0 || echo 1)"
            echo "timeout_secs=${IN_TIMEOUT_SECS:-900}"
          } >> "$GITHUB_OUTPUT"

      - name: Expand package list
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          matrix="$(python3 scripts/pkglib.py matrix "${PACKAGES:-}")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Running: ${matrix}"

  # One job per package. fail-fast is off so one red package does not hide the
  # others, each package gets its own timeout instead of sharing one budget, and
  # a single flaky package can be re-run from the Actions UI.
  run:
    name: ${{ matrix.package }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      # The testbed, not the caller -- see the `plan` job.
      - name: Check out the testbed
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          # Without a suffix every matrix job computes an identical cache key,
          # so they all race to reserve one entry and all but one fail to
          # save. The interpreter is in here too, so changing python_version
          # does not silently reuse caches built against the old one.
          cache-suffix: ${{ matrix.package }}-py${{ needs.plan.outputs.python_version }}
          # The default glob matches every packages/*/requirements.txt, which
          # would make one dependabot bump invalidate every package's cache. Key each
          # job on its own pin plus the shared build constraints.
          cache-dependency-glob: |
            packages/${{ matrix.package }}/requirements.txt
            build-constraints.txt

      - name: Download tornado artifact
        if: needs.plan.outputs.tornado_artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.plan.outputs.tornado_artifact }}
          path: tornado-artifact

      - name: Resolve the tornado under test
        env:
          ARTIFACT: ${{ needs.plan.outputs.tornado_artifact }}
          SPEC: ${{ needs.plan.outputs.tornado_spec }}
        run: |
          if [[ -n "${ARTIFACT}" ]]; then
            # Fails loudly if the artifact holds no wheel or sdist: falling back
            # to PyPI's tornado would make the run meaningless.
            ./scripts/resolve_tornado_artifact.sh tornado-artifact >> "$GITHUB_ENV"
          else
            echo "TORNADO_SPEC=${SPEC}" >> "$GITHUB_ENV"
          fi

      # Command-line tools a package's suite shells out to (apt_packages in its
      # package.env). The package's own setup.sh checks they are present, so
      # a missing one is a SETUP_FAIL rather than a red test run.
      - name: Install system packages
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          apt_packages="$(python3 scripts/pkglib.py apt "${PACKAGE}")"
          if [[ -n "${apt_packages}" ]]; then
            sudo apt-get update -q
            # shellcheck disable=SC2086  # a space-separated list, split on purpose
            sudo apt-get install -y -q --no-install-recommends ${apt_packages}
          fi

      # matrix.package goes through the environment rather than being expanded
      # into the shell command, so the run block holds no template expansion.
      - name: Check out ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: ./scripts/setup.sh "${PACKAGE}"

      # A red package turns this job red, so the failure is visible on the
      # package that caused it rather than only in the report. That does not
      # stop the rest of the run: the uploads below are `if: always()`, the
      # matrix is fail-fast: false, and the report job runs regardless. With
      # fail_on_regression off (report-only), a red package leaves this job
      # green, matching the report.
      - name: Run ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
          PYTHON_VERSION: ${{ needs.plan.outputs.python_version }}
          COVERAGE: ${{ needs.plan.outputs.coverage }}
          TIMEOUT_SECS: ${{ needs.plan.outputs.timeout_secs }}
          FAIL_ON_REGRESSION: ${{ needs.plan.outputs.fail_on_regression }}
        run: |
          rc=0
          ./scripts/run_one.sh "${PACKAGE}" || rc=$?

          # run_one.sh sends the install and test output to the log file and
          # prints only a summary. Put the whole log in this job's output too:
          # expanded when the package failed, folded when it passed.
          log="logs/${PACKAGE}.log"
          if [[ "${rc}" -eq 0 ]]; then
            echo "::group::Full log (${log})"
            cat "${log}" 2>/dev/null || echo "(no log written)"
            echo "::endgroup::"
            exit 0
          fi

          echo "==================== Full log (${log}) ===================="
          cat "${log}" 2>/dev/null || echo "(no log written)"
          status="$(sed -n 's/^status=//p' "results/${PACKAGE}.txt" 2>/dev/null)"
          echo "::error title=${PACKAGE}: ${status:-no result}::${PACKAGE} finished with ${status:-no result} (exit ${rc}); the full log is above."
          if [[ "${FAIL_ON_REGRESSION}" == "1" ]]; then
            exit "${rc}"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.package }}
          path: |
            results/${{ matrix.package }}.txt
            logs/${{ matrix.package }}.log
          if-no-files-found: warn

      - name: Upload raw coverage data
        if: always() && needs.plan.outputs.coverage == '1'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}
          path: coverage/${{ matrix.package }}.coverage
          if-no-files-found: ignore

  report:
    name: Report
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      total: ${{ steps.report.outputs.total }}
      passed: ${{ steps.report.outputs.passed }}
      failed: ${{ steps.report.outputs.failed }}
    steps:
      # The testbed, not the caller -- see the `plan` job.
      - name: Check out the testbed
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Collect per-package results
        uses: actions/download-artifact@v7
        with:
          pattern: result-*
          path: collected
          merge-multiple: true

      # Tolerated rather than required: if every package failed before producing
      # coverage there is nothing to download, and that must not cost us the
      # test report, which is the thing people actually came for.
      - name: Collect per-package coverage data
        if: needs.plan.outputs.coverage == '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - uses: astral-sh/setup-uv@v7
        if: needs.plan.outputs.coverage == '1'
        with:
          cache-suffix: report

      - name: Download tornado artifact
        if: needs.plan.outputs.coverage == '1' && needs.plan.outputs.tornado_artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.plan.outputs.tornado_artifact }}
          path: tornado-artifact

      # The reports are rendered against a tornado this job installs, so it has
      # to be the same one the packages ran against or the annotated HTML will
      # not line up with the recorded line numbers.
      - name: Build coverage reports
        if: needs.plan.outputs.coverage == '1'
        env:
          ARTIFACT: ${{ needs.plan.outputs.tornado_artifact }}
          SPEC: ${{ needs.plan.outputs.tornado_spec }}
          PYTHON_VERSION: ${{ needs.plan.outputs.python_version }}
        run: |
          if [[ -n "${ARTIFACT}" ]]; then
            eval "$(./scripts/resolve_tornado_artifact.sh tornado-artifact)"
            export TORNADO_SPEC
          else
            export TORNADO_SPEC="${SPEC}"
          fi
          # Best-effort, exactly as ci.sh treats it: a failed report build must
          # not mask the test results the run already produced.
          ./scripts/gen_reports.sh || echo "WARNING: coverage report generation failed"

      - name: Report
        id: report
        env:
          TORNADO_SPEC: ${{ needs.plan.outputs.tornado_spec }}
          FAIL_ON_REGRESSION: ${{ needs.plan.outputs.fail_on_regression }}
          # The downloaded artifacts keep their results/ and logs/ prefixes.
          RESULTS_DIR: ${{ github.workspace }}/collected/results
          LOGS_DIR: ${{ github.workspace }}/collected/logs
        run: ./scripts/report.sh

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testbed-results
          path: collected/
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always() && needs.plan.outputs.coverage == '1'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage_html/
          if-no-files-found: warn
